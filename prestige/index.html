<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Эпоха I · Integrals Clicker</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;touch-action:pan-x pan-y}body{height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#08131a;color:#f6edda;font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{flex:none;background:#122631;border-bottom:1px solid #36505c;padding:8px 16px;display:flex;align-items:center;justify-content:center;gap:10px 30px;flex-wrap:wrap}
.info{display:grid;gap:2px}h1{font:italic bold 21px/1.1 Georgia,serif;margin:0}p{margin:0;color:#c6d9dc}
nav{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.modes{display:flex;padding:3px;border-radius:9px;background:#0b1d27;gap:2px}
button{font:inherit;cursor:pointer;border:1px solid transparent;border-radius:6px;background:transparent;color:#d9e4e3;padding:7px 10px;min-height:34px}
button[aria-pressed=true]{background:#e5bf77;color:#12232d;font-weight:650}button:focus-visible{outline:2px solid #f2ca7f;outline-offset:2px}#again{border-color:#47616b}
main{position:relative;flex:1;min-height:0;overflow:hidden}iframe{border:0;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--scale,0));background:#091824}
@media(max-width:630px){header{padding:7px 10px;gap:6px 12px}.info{text-align:center}h1{font-size:18px}p{font-size:13px}button{font-size:13px;padding:5px 7px}}
.back{color:#edcf94;padding:7px 9px;text-decoration:none}.back:hover{text-decoration:underline}</style></head>
<body><header><div class="info"><h1>Переход в эпоху I</h1><p id="hint" role="status">В тестовой игре нажми «Чёрная дыра».</p></div><nav aria-label="Демонстрация"><a class="back" href="../?v=0.3.36">Игра</a><div class="modes"><button type="button" data-mode="portrait">Вертикально</button><button type="button" data-mode="landscape">Горизонтально</button></div><button id="again" type="button">Сначала</button><a class="back" href="duo.mp4?v=eca099ef6297">Посмотреть переход</a><a class="back" href="../iphone/prestige.mp4">Сравнить с iPhone</a></nav></header>
<main id="view"><iframe title="Тестовая игра на Дуо Макс" allow="autoplay"></iframe></main>

<script>

const stage = document.querySelector('main');
const frame = stage.querySelector('iframe');
const hint = document.getElementById('hint');
const modeButtons = document.querySelectorAll('[data-mode]');
function fit() {
  const scale = Math.min(stage.clientWidth / Number(frame.width), stage.clientHeight / Number(frame.height));
  frame.style.setProperty('--scale', String(scale));
}
function orient() {
  const landscape = location.hash === '#landscape';
  frame.width = landscape ? 1920 : 1200;
  frame.height = landscape ? 1200 : 1920;
  modeButtons.forEach(b => b.setAttribute('aria-pressed', String((b.dataset.mode === 'landscape') === landscape)));
  fit();
}
modeButtons.forEach(b => b.onclick = () => {location.hash = b.dataset.mode;});
window.addEventListener('hashchange',orient);
new ResizeObserver(fit).observe(stage);
function replay() {
  hint.textContent = 'В тестовой игре нажми «Чёрная дыра».';
  frame.src = 'entry.html?v=8df6eac6afa8';
}
window.addEventListener('message', event => {
  if(event.source === frame.contentWindow && event.data === 'prestige-demo-complete') {
    hint.textContent = 'Началась эпоха I. Открой профиль, чтобы увидеть новый уровень.';
  }
});
document.getElementById('again').onclick = replay;
orient(); replay();
</script></body></html>
