<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b1b25">
  <title>Integrals Clicker · Дуо Макс</title>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;touch-action:pan-x pan-y}
    body{height:100dvh;display:flex;flex-direction:column;background:#091824;color:#c3d4d7;font:15px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{padding:5px max(10px,env(safe-area-inset-right)) 5px max(10px,env(safe-area-inset-left));display:flex;align-items:center;gap:8px;background:#0e202c;border-bottom:1px solid #32464f}
    header span{margin-inline-end:auto;font:italic bold 16px Georgia,serif;color:#edcd90}
    a,select{font:inherit;color:#f0dab1;background:#102530;text-decoration:none;border:1px solid #4d5a57;border-radius:6px;padding:6px 8px;white-space:nowrap}
    a:hover,select:hover,a:focus-visible,select:focus-visible{background:#26383e}
    main{position:relative;flex:1;min-height:0;overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0}
    iframe.fixed{position:absolute;left:50%;top:50%;width:var(--w);height:var(--h);transform:translate(-50%,-50%) scale(var(--scale))}
    @media(max-width:400px){header{gap:5px}a,select{font-size:13px}}
  </style>
</head>
<body>
  <header>
    <span>Дуо Макс</span>
    <select aria-label="Размер экрана игры" id="size">
      <option value="auto">По окну</option>
      <option value="portrait">Вертикально</option>
      <option value="landscape">Горизонтально</option>
    </select>
    <a href="training/">Обучение</a>
    <a href="prestige/?v=d16a1d3d90b0">Демо престижа</a>
  </header>
  <main><iframe title="Integrals Clicker" src="game/index.html?v=9cd6a1fd8bf7" allow="autoplay; fullscreen" allowfullscreen></iframe></main>
  <script>
    const sizes = {portrait: [1200, 1920], landscape: [1920, 1200]};
    const select = document.getElementById('size');
    const stage = document.querySelector('main');
    const game = stage.querySelector('iframe');
    function fit() {
      const size = sizes[location.hash.slice(1)];
      select.value = size ? location.hash.slice(1) : 'auto';
      game.classList.toggle('fixed', Boolean(size));
      if (!size) return;
      const [w,h] = size;
      game.style.setProperty('--w', w+'px');
      game.style.setProperty('--h', h+'px');
      game.style.setProperty('--scale', Math.min(stage.clientWidth/w,stage.clientHeight/h));
    }
    select.addEventListener('change', () => { location.hash = select.value === 'auto' ? '' : select.value; });
    addEventListener('hashchange', fit);
    new ResizeObserver(fit).observe(stage);
    fit();
  </script>
</body>
</html>
