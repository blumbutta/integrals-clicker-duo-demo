<template id="game-modules"><script defer src="game.js?v=2c3b6ffa1ccf"></script></template>
<script id="new-game-training">// Select modules before launch.js opens the ordinary game's inert template.
(() => {
  "use strict";
  const modules = document.getElementById("game-modules");
  if (!modules || window.DuoTraining || !/\/game(?:\/index\.html|\/)?$/.test(location.pathname)) return;

  // Select first-run coaching before the shared economy and achievements initialize.
(() => {
  "use strict";
  if (window.DuoTraining) return;
  const saveKey = "integrals.duomax.progress.v1";
  const lessonKey = "integrals-clicker-duo-tutorial-v1";
  const phases = new Set(("firstTap score firstFunds bit buySize passiveIntro passiveWatch passiveResult earn upgrade testUpgrade upgradeResult " +
    "school map schoolTask prepareQuiz timer quiz reward cooldown team honors honorsSeen gallery applyTheme home ranking complete").split(" "));
  function parse(value) {
    try { return JSON.parse(value); } catch (_) { return null; }
  }
  function usableStorage() {
    let original;
    try {
      original = window.localStorage;
      const probe = saveKey + ".write-probe";
      original.setItem(probe, "1");
      const readable = original.getItem(probe) === "1";
      original.removeItem(probe);
      if (!readable) throw new Error("Storage unavailable");
      return original;
    } catch (_) {}
    // Browsers can expose a read-only localStorage. Keep its existing values
    // readable, and allow transactional purchases in this tab without wiping it.
    const tempKey = saveKey + ".tab-fallback";
    let tab, values = new Map();
    try {
      tab = window.sessionStorage;
      const saved = parse(tab.getItem(tempKey));
      if (Array.isArray(saved)) values = new Map(saved);
    } catch (_) {}
    function persist() {
      try { tab?.setItem(tempKey, JSON.stringify([...values])); } catch (_) {}
    }
    const fallback = {
      duoReadOnlyFallback: true,
      getItem(key) {
        if (values.has(key)) return values.get(key);
        try { return original?.getItem(key) ?? null; } catch (_) { return null; }
      },
      setItem(key, value) { values.set(String(key), String(value)); persist(); },
      removeItem(key) { values.set(String(key), null); persist(); }
    };
    try { Object.defineProperty(window, "localStorage", {value: fallback, configurable: true}); }
    catch (_) { return null; }
    return fallback;
  }
  const storage = usableStorage();
  if (!storage) return;
  const game = parse(storage.getItem(saveKey));
  const lesson = parse(storage.getItem(lessonKey));
  const positive = x => Number.isFinite(x) && x > 0;
  if (lesson?.phase === "done" || game?.progress?.trainingGuideComplete ||
      [game?.prestigeLevel, game?.highestPrestige, game?.cosmicAscensions].some(positive) ||
      (Number.isFinite(game?.version) && game.version > 1)) return;
  if (!phases.has(lesson?.phase)) {
    const played = [game?.clicks, game?.balance, game?.totalEarned, game?.lifetimeEarned, game?.runEarned,
      game?.progress?.quests?.wins, game?.progress?.quests?.losses].some(positive) ||
      [game?.counts, game?.purchases, game?.runPurchases].some(items => Object.values(items || {}).some(positive)) ||
      game?.upgrades?.length > 0 || !!game?.progress?.quests?.active;
    if (played) return;
    storage.setItem(lessonKey, JSON.stringify({phase:"firstTap", upgradeTaught:false, questDone:false}));
  }

  window.DuoTraining = {};
})();

if (!window.DuoTraining) return;

  const sheet = document.createElement("link");
  sheet.rel = "stylesheet"; sheet.href = "../training/training-view.css?v=271c95166a5f"; document.head.append(sheet);
  const scripts = ["../training/game.js?v=cfea3c906d80", "../training/training-view.js?v=74f57caa227b", "../training/training.js?v=df9b4e8891f4"].map(src => {
    const script = document.createElement("script");
    script.defer = true; script.src = src;
    return script;
  });
  modules.content.replaceChildren(...scripts);
})();
</script>
