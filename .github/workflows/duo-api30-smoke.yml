name: Verify Duo Max 0.3.21 on Android 11
on:
  push:
    branches: [qa/duo-release-0321]
    paths: [.github/workflows/duo-api30-smoke.yml]
permissions:
  contents: read
jobs:
  widget-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ANDROID_SERIAL: emulator-5556
      QA_BRANCH: qa/duo-release-0321
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Start Android 11 virtual tablet
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sdkmanager 'system-images;android-30;google_apis;x86_64' 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'emulator' >/tmp/duo-sdk.log
          export ANDROID_USER_HOME="$RUNNER_TEMP/duo-android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n DuoApi30 --device pixel_2 -p "$ANDROID_AVD_HOME/DuoApi30.avd" -k 'system-images;android-30;google_apis;x86_64' --force
          test -s "$ANDROID_AVD_HOME/DuoApi30.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-30\n' "$ANDROID_AVD_HOME/DuoApi30.avd" > "$ANDROID_AVD_HOME/DuoApi30.ini"
          emulator -list-avds | grep -Fx DuoApi30
          emulator -avd DuoApi30 -port 5556 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -accel on -cores 2 -memory 2456 > /tmp/duo-emulator.log 2>&1 </dev/null &
          emulator_pid=$!
          sleep 4
          kill -0 "$emulator_pid" || { cat /tmp/duo-emulator.log; exit 1; }
          timeout 180 adb -s "$ANDROID_SERIAL" wait-for-device
          timeout 240 bash -c 'until adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -qx 1; do sleep 2; done'
          adb -s "$ANDROID_SERIAL" shell input keyevent 82
          adb -s "$ANDROID_SERIAL" shell wm size 1200x1920
          adb -s "$ANDROID_SERIAL" shell wm density 160
          adb -s "$ANDROID_SERIAL" shell getprop ro.build.version.sdk
      - name: Check the updated pin bridge across immediate reboot before release
        shell: bash
        run: |
          set -euo pipefail
          bash duo-qa/native-home-gesture.sh prepare
          old=$(adb -s "$ANDROID_SERIAL" shell cat /proc/sys/kernel/random/boot_id | tr -d '\r')
          adb -s "$ANDROID_SERIAL" reboot
          timeout 180 adb -s "$ANDROID_SERIAL" wait-for-device
          timeout 240 bash -c 'until [[ $(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r") == 1 ]]; do sleep 2; done'
          test "$old" != "$(adb -s "$ANDROID_SERIAL" shell cat /proc/sys/kernel/random/boot_id | tr -d '\r')"
          adb -s "$ANDROID_SERIAL" shell input keyevent KEYCODE_WAKEUP
          adb -s "$ANDROID_SERIAL" shell wm dismiss-keyguard
          bash duo-qa/native-home-gesture.sh verify-pin
          adb -s "$ANDROID_SERIAL" uninstall review.duo.pincheck
          rm -f "$RUNNER_TEMP/duo-pin-and-gesture/no-pin"
          adb -s "$ANDROID_SERIAL" shell wm size 1200x1920
          adb -s "$ANDROID_SERIAL" shell wm density 160
      - name: Await exact one-widget release APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 110); do
            git fetch --no-tags --quiet --depth=1 origin "refs/heads/$QA_BRANCH"
            if git cat-file -e FETCH_HEAD:duo-qa/release-0321.sha256 2>/dev/null; then
              git checkout FETCH_HEAD -- duo-qa
              cmp duo-qa/release-0321.sha256 duo-qa/final.sha256
              echo "$(tr -d '\r\n' < duo-qa/final.sha256)  duo-qa/final.apk" | sha256sum -c -
              exit 0
            fi
            sleep 15
          done
          echo 'Signed final one-widget build did not arrive' >&2
          exit 1
      - name: Verify production update, balance widget and both gallery orientations
        run: bash duo-qa/smoke.sh
      - name: Render selected background and button in stock WebView
        if: '!cancelled()'
        run: bash duo-qa/artwork.sh "$(cat "$RUNNER_TEMP/duo-widget-skin" 2>/dev/null || echo unknown)"
      - name: Verify portrait and landscape navigation button edges
        if: '!cancelled()'
        run: bash duo-qa/extra.sh edge
      - name: Verify map zoom, click and two-contact purchases
        if: '!cancelled()'
        run: |
          git fetch --quiet --depth=1 origin "refs/heads/$QA_BRANCH"
          git checkout FETCH_HEAD -- duo-qa/TwoFingerActivity.java
          bash duo-qa/extra.sh pinch
          echo "PASS: final package $(cat duo-qa/final.sha256)"
      - name: Reboot tablet and verify the pinned balance widget
        run: bash duo-qa/widget-reboot.sh
      - name: Exercise launcher icon changes and return to home
        if: '!cancelled()'
        run: bash duo-qa/launcher-reentry.sh
      - name: Device diagnostics on failure
        if: failure()
        run: |
          tail -25 /tmp/duo-emulator.log || true
          timeout 8 "$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" logcat -d -s 'DuoWidgetQA:I' 'AndroidRuntime:E' '*:S' | tail -100 || true

      - name: Capture production ANR and WebView evidence
        if: failure()
        shell: bash
        run: |
          adb -s "$ANDROID_SERIAL" root >/dev/null
          adb -s "$ANDROID_SERIAL" wait-for-device
          adb -s "$ANDROID_SERIAL" shell dumpsys activity lastanr | head -150 || true
          adb -s "$ANDROID_SERIAL" logcat -d -b events | grep -E 'am_anr|am_crash|am_kill|am_finish_activity|am_new_intent|wm_on_resume_called' | tail -80 || true
          adb -s "$ANDROID_SERIAL" logcat -d | grep -Ei 'ANR in |Input dispatching timed out|chromium.*(error|fail)|cr_WebView|FATAL EXCEPTION|timed out waiting|Application is not responding' | tail -80 || true
          adb -s "$ANDROID_SERIAL" shell ls -l /data/anr || true
          for trace in $(adb -s "$ANDROID_SERIAL" shell ls -t /data/anr | tr -d '\r' | head -3); do
            adb -s "$ANDROID_SERIAL" exec-out cat "/data/anr/$trace" > "$RUNNER_TEMP/$trace"
            python3 - "$RUNNER_TEMP/$trace" <<'PY'
          import sys
          data=open(sys.argv[1],errors="replace").read()
          for segment in data.split("----- pid "):
              if "Cmd line: ru.mathclicker.duo\n" not in segment: continue
              print(segment[:400])
              lines=segment.splitlines()
              for i,line in enumerate(lines):
                  if line.startswith(('"main"','"JavaBridge"','"Chrome_InProc','"Binder:')): print('\n'.join(lines[i:i+35]))
          PY
          done
