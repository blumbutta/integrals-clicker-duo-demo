name: Diagnose warm re-entry on Android 11
on:
  push:
    branches: [qa/duo-anr-0320]
    paths: [.github/workflows/duo-api30-smoke.yml]
permissions:
  contents: read
jobs:
  widget-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ANDROID_SERIAL: emulator-5556
      QA_BRANCH: qa/duo-anr-0320
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Start Android 11 virtual tablet
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sdkmanager 'system-images;android-30;google_apis;x86_64' 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'emulator' >/tmp/duo-sdk.log
          export ANDROID_USER_HOME="$RUNNER_TEMP/duo-android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n DuoApi30 --device pixel_2 -p "$ANDROID_AVD_HOME/DuoApi30.avd" -k 'system-images;android-30;google_apis;x86_64' --force
          test -s "$ANDROID_AVD_HOME/DuoApi30.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-30\n' "$ANDROID_AVD_HOME/DuoApi30.avd" > "$ANDROID_AVD_HOME/DuoApi30.ini"
          emulator -list-avds | grep -Fx DuoApi30
          emulator -avd DuoApi30 -port 5556 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -accel on -cores 2 -memory 2456 > /tmp/duo-emulator.log 2>&1 </dev/null &
          emulator_pid=$!
          sleep 4
          kill -0 "$emulator_pid" || { cat /tmp/duo-emulator.log; exit 1; }
          timeout 180 adb -s "$ANDROID_SERIAL" wait-for-device
          timeout 240 bash -c 'until adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -qx 1; do sleep 2; done'
          adb -s "$ANDROID_SERIAL" shell input keyevent 82
          adb -s "$ANDROID_SERIAL" shell wm size 1200x1920
          adb -s "$ANDROID_SERIAL" shell wm density 160
          adb -s "$ANDROID_SERIAL" shell getprop ro.build.version.sdk

      - name: Install exact public APK and collect warm and cold exit behavior
        run: bash duo-qa/anr.sh
      - name: Capture production ANR and WebView evidence
        if: always()
        shell: bash
        run: |
          adb -s "$ANDROID_SERIAL" root >/dev/null
          adb -s "$ANDROID_SERIAL" wait-for-device
          adb -s "$ANDROID_SERIAL" shell dumpsys activity lastanr | head -150 || true
          adb -s "$ANDROID_SERIAL" logcat -d -b events | grep -E 'am_anr|am_crash|am_kill|am_finish_activity|am_new_intent|wm_on_resume_called' | tail -80 || true
          adb -s "$ANDROID_SERIAL" logcat -d | grep -Ei 'ANR in |Input dispatching timed out|chromium.*(error|fail)|cr_WebView|FATAL EXCEPTION|timed out waiting|Application is not responding' | tail -80 || true
          adb -s "$ANDROID_SERIAL" shell ls -l /data/anr || true
          for trace in $(adb -s "$ANDROID_SERIAL" shell ls -t /data/anr | tr -d '\r' | head -3); do
            adb -s "$ANDROID_SERIAL" exec-out cat "/data/anr/$trace" > "$RUNNER_TEMP/$trace"
            python3 - "$RUNNER_TEMP/$trace" <<'PY'
          import sys
          data=open(sys.argv[1],errors="replace").read()
          for segment in data.split("----- pid "):
              if "Cmd line: ru.mathclicker.duo\n" not in segment: continue
              print(segment[:400])
              lines=segment.splitlines()
              for i,line in enumerate(lines):
                  if line.startswith(('"main"','"JavaBridge"','"Chrome_InProc','"Binder:')): print('\n'.join(lines[i:i+35]))
          PY
          done
