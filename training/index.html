<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1c26">
  <title>Первый город · Integrals Clicker</title>
  <style>
    * { box-sizing: border-box }
    html, body { height: 100%; margin: 0; touch-action: pan-x pan-y }
    body { height: 100dvh; display: flex; flex-direction: column; background: #071720; color: #f8e8ce; font-family: system-ui,sans-serif }
    header { min-height: 45px; padding: 4px clamp(8px,2vw,25px); display: flex; align-items: center; flex-wrap: wrap; gap: 7px; background: #0b202b; border-bottom: 1px solid #415051 }
    header strong { margin-right: auto; font: italic bold clamp(16px,2.5vw,21px)/1.15 Georgia,serif; color: #f5d799 }
    button, select { background: #12303a; border: 1px solid #546463; border-radius: 7px; color: #f7e3bc; padding: 6px 9px; font: 500 14px/1.3 system-ui,sans-serif; min-height: 34px; cursor: pointer }
    button:hover, select:hover { background: #24414a }
    :focus-visible { outline: 2px solid #ffc664; outline-offset: 2px }
    main { position: relative; flex: 1; min-height: 0; overflow: hidden }
    iframe { display: block; width: 100%; height: 100%; border: 0 }
    iframe.fixed { position: absolute; left: 50%; top: 50%; width: var(--w); height: var(--h); transform: translate(-50%,-50%) scale(var(--scale)) }
    @media(max-width:400px) { header { gap: 4px } button, select { padding-inline: 6px; font-size: 13px } }
  </style>
</head>
<body>
  <header>
    <strong>Обучение</strong>
    <select id="size" aria-label="Положение экрана">
      <option value="auto">По окну</option>
      <option value="landscape">Горизонтально</option>
      <option value="portrait">Вертикально</option>
    </select>
    <button id="restart" type="button" title="Начать учебную партию с нуля">Начать заново</button>
  </header>
  <main><iframe title="Учебная партия Integrals Clicker" allow="autoplay; fullscreen" allowfullscreen></iframe></main>
  <script>
    'use strict';
    const frame = document.querySelector('iframe');
    const size = document.getElementById('size');
    const stage = document.querySelector('main');
    const dimensions = {portrait:[1200,1920], landscape:[1920,1200]};
    const token = () => Array.from(crypto.getRandomValues(new Uint32Array(3)), n => n.toString(16).padStart(8,'0')).join('');
    // Changes to initial rewards require a fresh lesson, including on reload.
    const tutorialVersion = 2;
    let run = history.state?.tutorialVersion === tutorialVersion ? history.state.trainingRun : null;
    if (!/^[a-f0-9]{24}$/.test(run || '')) run = token();
    function fit() {
      const shape = dimensions[size.value];
      frame.classList.toggle('fixed', !!shape);
      if (!shape) return;
      frame.style.setProperty('--w',shape[0]+'px');
      frame.style.setProperty('--h',shape[1]+'px');
      frame.style.setProperty('--scale',Math.min(stage.clientWidth / shape[0],stage.clientHeight / shape[1]));
    }
    function remember() {
      try { history.replaceState({trainingRun:run,orientation:size.value,tutorialVersion},''); } catch (_) {}
    }
    function play() {
      remember();
      frame.src = 'entry.html?v=4d7e95e98d92&run='+run;
    }
    const requested = location.hash.slice(1) || history.state?.orientation;
    size.value = dimensions[requested] ? requested : 'auto';
    size.addEventListener('change',()=>{fit(); remember();});
    new ResizeObserver(fit).observe(stage);
    document.getElementById('restart').addEventListener('click',()=>{
      const previous = run;
      run = token();
      frame.addEventListener('load',()=>{
        try {
          for (const kind of ['local','session']) sessionStorage.removeItem('duo.training.v1.'+previous+'.'+kind);
        } catch (_) {}
      },{once:true});
      play();
    });
    fit(); play();
  </script>
</body>
</html>
